<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/assets/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A060D" />
    <meta name="description" content="DISCARDED: thall and blackened deathcore. New music, upcoming shows, press kit and booking." />

    <!--
      Link previews (WhatsApp, Instagram, Facebook, Discord, X...).
      These apps don't run JavaScript, so this one set of tags is what every
      shared link shows. To change the picture, replace
      public/assets/share-image.jpg (1200x630 JPG, under ~300 KB) and give it
      a new file name here so the apps fetch the new one instead of their
      cached copy.
    -->
    <meta property="og:site_name" content="DISCARDED" />
    <meta property="og:title" content="DISCARDED" />
    <meta property="og:description" content="Thall and blackened deathcore. New music, upcoming shows, press kit and booking." />
    <meta property="og:image" content="https://discardedband.com/assets/share-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A dark still life of flowers, one of them burning" />
    <meta property="og:url" content="https://discardedband.com/" />
    <meta property="og:type" content="website" />

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="DISCARDED" />
    <meta name="twitter:description" content="Thall and blackened deathcore. New music, upcoming shows, press kit and booking." />
    <meta name="twitter:image" content="https://discardedband.com/assets/share-image.jpg" />
    <meta name="twitter:image:alt" content="A dark still life of flowers, one of them burning" />

    <title>Discarded</title>
</head>
